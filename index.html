<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07060d" />
  <title>Battle Bugs</title>
  <meta name="description" content="A 2D browser vehicle arena battler: build a bug, push aliens off a shrinking dohyo, claim their rides." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/workshop.css" />
</head>
<body>
  <div id="app">
    <div id="masthead">
      <header id="topbar"></header>
      <nav id="tabbar" aria-label="Terminal"></nav>
    </div>

    <main id="workshop-screen" class="screen active">
      <section id="hoist-panel" class="panel" aria-label="Workshop hoist"></section>
      <section id="terminal-panel" class="panel" aria-label="Terminal"></section>
    </main>

    <main id="battle-screen" class="screen" aria-label="Arena">
      <canvas id="game-canvas"></canvas>
      <div id="battle-controls"></div>
    </main>

    <div id="overlay-root"></div>
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
  </div>
  <noscript>Battle Bugs needs JavaScript (ES modules) to run.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
